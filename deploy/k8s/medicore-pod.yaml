# Practice 12: simple Pod. kubectl apply -f medicore-pod.yaml
apiVersion: v1
kind: Pod
metadata: { name: medicore-web, labels: { app: medicore } }
spec:
  containers:
    - name: web
      image: medicore-web:latest   # built from frontend/Dockerfile
      ports: [{ containerPort: 80 }]
      resources: { limits: { memory: 128Mi, cpu: 200m } }
      readinessProbe: { httpGet: { path: /, port: 80 } }
---
apiVersion: v1
kind: Service
metadata: { name: medicore-web }
spec:
  type: NodePort
  selector: { app: medicore }
  ports: [{ port: 80, targetPort: 80 }]
