# Practice 11: containerised stack (db + api + web). Run: DB_PASSWORD=... JWT_SECRET=... docker compose -f docker-compose.prod.yml up -d --build
services:
  mysql:
    image: mysql:8.0
    environment: { MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", MYSQL_DATABASE: medicore }
    volumes: [db:/var/lib/mysql]
    restart: unless-stopped
  api:
    build: ./backend
    environment: { NODE_ENV: production, DB_HOST: mysql, DB_PASSWORD: "${DB_PASSWORD}", JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}", CLIENT_ORIGIN: http://localhost }
    depends_on: [mysql]
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on: [api]
    restart: unless-stopped
volumes: { db: {} }
